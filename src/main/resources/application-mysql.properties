# Se activa con:  --spring.profiles.active=mysql
# Crear antes la base:  CREATE DATABASE transporte CHARACTER SET utf8mb4;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transporte?serverTimezone=America/Argentina/Tucuman}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
