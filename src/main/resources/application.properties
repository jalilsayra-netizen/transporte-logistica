spring.application.name=transporte-logistica
server.port=8080

# ---- Base de datos (H2 en archivo: los datos se conservan al reiniciar) ----
# Las credenciales se pueden cambiar con variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/transporte}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate: crea y actualiza las tablas a partir de las entidades ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JSON ----
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Argentina/Tucuman

# ---- Swagger (solo ADMIN logueado) ----
springdoc.swagger-ui.path=/swagger-ui.html
