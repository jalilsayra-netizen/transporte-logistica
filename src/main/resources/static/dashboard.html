<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Transporte y Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h3 mb-0">Dashboard</h1>
            <div class="d-flex gap-2"></div>
        </div>
        <div id="alertas"></div>
        <h2 class="h5 text-muted">Estado de los envíos</h2>
        <div class="row g-3 mb-4" id="tarjetasEnvios"></div>
        <div id="bloqueExtra">
            <h2 class="h5 text-muted">Resumen general</h2>
            <div class="row g-3 mb-4" id="tarjetasExtra"></div>
        </div>
        <h2 class="h5 text-muted">Últimos envíos</h2>
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="tablaUltimos">
                <thead class="table-light"><tr><th>N°</th><th>Cliente</th><th>Destino</th><th>Salida</th><th>Estado</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="mt-3"><a href="envios.html" class="btn btn-outline-primary btn-sm">Ver todos los envíos</a></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
