<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Transporte y Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="pantalla-login">
    <main class="caja-login px-3">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="display-5">&#128666;</div>
                    <h1 class="h4 mt-2">Transporte y Logística</h1>
                    <p class="text-muted mb-0">Ingrese con su usuario y contraseña</p>
                </div>
                <div id="alertas"></div>
                <form id="formLogin" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required autocomplete="username" autofocus>
                        <div class="invalid-feedback">Ingrese su usuario.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        <div class="invalid-feedback">Ingrese su contraseña.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btnIngresar">Ingresar</button>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
