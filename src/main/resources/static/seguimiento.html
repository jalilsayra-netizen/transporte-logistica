<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seguimiento - Transporte y Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h3 mb-0">Seguimiento de envíos</h1>
            <div class="d-flex gap-2"></div>
        </div>
        <div id="alertas"></div>
        <div class="row g-2 mb-4">
            <div class="col-md-8">
                <label for="selEnvio" class="form-label">Seleccione un envío</label>
                <select id="selEnvio" class="form-select"><option value="">Seleccione...</option></select>
            </div>
        </div>
        <div id="sinSeleccion" class="alert alert-info">Seleccione un envío para ver su estado e historial.</div>
        <div class="row g-3 d-none" id="detalle">
            <div class="col-lg-6">
                <div class="card h-100"><div class="card-body">
                    <h2 class="h5 card-title" id="tituloEnvio"></h2>
                    <dl class="row mb-0" id="datosEnvio"></dl>
                </div></div>
            </div>
            <div class="col-lg-6">
                <div class="card h-100"><div class="card-body">
                    <h2 class="h5 card-title">Historial de estados</h2>
                    <ul class="linea-tiempo mt-3" id="historial"></ul>
                </div></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
<script src="js/seguimiento.js"></script>
</body>
</html>
